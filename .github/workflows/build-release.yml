name: Build signed release APK and AAB

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        id: unit_tests
        run: |
          ./gradlew testDebugUnitTest
          TESTS=0
          FAILURES=0
          ERRORS=0
          SKIPPED=0
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            TESTS=$((TESTS + $(grep -m1 -o ' tests="[0-9]*"' "$f" | grep -o '[0-9]*')))
            FAILURES=$((FAILURES + $(grep -m1 -o ' failures="[0-9]*"' "$f" | grep -o '[0-9]*')))
            ERRORS=$((ERRORS + $(grep -m1 -o ' errors="[0-9]*"' "$f" | grep -o '[0-9]*')))
            SKIPPED=$((SKIPPED + $(grep -m1 -o ' skipped="[0-9]*"' "$f" | grep -o '[0-9]*')))
          done
          echo "UNIT TESTS RAN: $TESTS, FAILED: $FAILURES, ERRORS: $ERRORS, SKIPPED: $SKIPPED"

      - name: Upload the test report (only when tests fail)
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Rebuild the keystore from the secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing. Cannot build a signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK and the signed App Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Name the APK and the AAB and check both are signed
        run: |
          VERSION_NAME=$(grep -m1 '^appVersionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$VERSION_NAME" ]; then
            echo "appVersionName is missing in gradle.properties."
            exit 1
          fi
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          cp "$APK" "dist/TwelvePits-${VERSION_NAME}.apk"
          cp "$AAB" "dist/TwelvePits-${VERSION_NAME}.aab"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify "dist/TwelvePits-${VERSION_NAME}.apk"
          echo "APK is signed: TwelvePits-${VERSION_NAME}.apk"
          AAB_CHECK=$(jarsigner -verify "dist/TwelvePits-${VERSION_NAME}.aab" 2>&1 || true)
          echo "$AAB_CHECK" | tail -n 3
          echo "$AAB_CHECK" | grep -q "jar verified"
          echo "AAB is signed: TwelvePits-${VERSION_NAME}.aab"

      - name: Check the permissions inside the APK
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          PERMISSIONS=$("$AAPT2" dump permissions dist/*.apk)
          echo "$PERMISSIONS"
          if echo "$PERMISSIONS" | grep -q "android.permission.INTERNET"; then
            echo "The APK asks for INTERNET. This game must not."
            exit 1
          fi

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: TwelvePits-release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload the AAB
        uses: actions/upload-artifact@v4
        with:
          name: TwelvePits-release-aab
          path: dist/*.aab
          if-no-files-found: error
